<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b5e4ff">
  <meta name="description" content="یه دعوت متفاوت، فقط برای تو 💌">
  <title>یه سوال کوچولو 💙</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=3">
  <script defer src="/assets/app.js?v=3"></script>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="aura aura--one"></div><div class="aura aura--two"></div>
    <span class="floating floating--heart f1">💗</span><span class="floating floating--letter f2">💌</span>
    <span class="floating floating--heart f3">💖</span><span class="floating floating--letter f4">💌</span>
    <span class="floating floating--heart f5">💕</span><span class="floating floating--letter f6">💌</span>
    <span class="floating floating--heart f7">💗</span><span class="floating floating--letter f8">💌</span>
    <span class="floating floating--heart f9">💕</span><span class="floating floating--letter f10">💌</span>
    <span class="floating floating--heart f11">💖</span><span class="floating floating--letter f12">💌</span>
  </div>
  <div id="heart-layer" class="heart-layer" aria-hidden="true"></div>
  <main class="page">
    <div class="invite-card">
      <div class="progress" aria-label="مراحل دعوت">
        <span class="progress-dot active"></span><span class="progress-dot"></span>
        <span class="progress-dot"></span><span class="progress-dot"></span>
      </div>
      <section class="screen active" id="step-question">
        <div class="feature-icon" id="icon-question">🥺</div>
        <p class="person" id="person" hidden></p>
        <p class="eyebrow" id="questionEyebrow"></p>
        <h1 id="questionTitle">با من میای سر قرار؟</h1>
        <p class="description" id="questionIntro"></p>
        <div class="answers">
          <button id="yes-btn" class="primary-btn" type="button">آره 💕</button>
          <button id="no-btn" class="secondary-btn" type="button">نه</button>
        </div>
        <p id="no-message" class="helper" aria-live="polite"></p>
      </section>
      <section class="screen" id="step-date" hidden>
        <div class="feature-icon" id="icon-date">📅</div>
        <p class="eyebrow" id="dateEyebrow"></p>
        <h1 id="dateTitle">کی وقت داری؟</h1>
        <p class="description" id="dateIntro"></p>
        <div class="calendar">
          <div class="calendar-heading">
            <button type="button" id="prev-month" class="month-btn" aria-label="ماه قبل">›</button>
            <strong id="month-label"></strong>
            <button type="button" id="next-month" class="month-btn" aria-label="ماه بعد">‹</button>
          </div>
          <div class="weekdays"><span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span></div>
          <div id="calendar-days" class="calendar-days" role="group" aria-label="انتخاب روز شمسی"></div>
        </div>
        <label class="time-label" for="time-input">ساعت قرار ⏰</label>
        <input type="time" id="time-input" class="time-input" required>
        <p id="date-error" class="error" role="alert" hidden>لطفاً روز و ساعت رو انتخاب کن 💕</p>
        <button id="date-next" class="primary-btn full-btn" type="button">بعدی ✨</button>
      </section>
      <section class="screen" id="step-food" hidden>
        <div class="feature-icon" id="icon-food">🍽️</div>
        <p class="eyebrow" id="foodEyebrow"></p>
        <h1 id="foodTitle">چی سفارش میدی؟</h1>
        <p class="description" id="foodIntro"></p>
        <div class="food-grid">
          <button type="button" class="food" data-food="قهوه" aria-pressed="false"><span>☕</span>قهوه</button>
          <button type="button" class="food" data-food="پیتزا" aria-pressed="false"><span>🍕</span>پیتزا</button>
          <button type="button" class="food" data-food="پاستا" aria-pressed="false"><span>🍝</span>پاستا</button>
          <button type="button" class="food" data-food="کوبیده" aria-pressed="false"><span>🍢</span>کوبیده</button>
        </div>
        <p id="food-error" class="error" role="alert" hidden>یکی از خوشمزه‌ها رو انتخاب کن 😋</p>
        <button id="finish-btn" class="primary-btn full-btn" type="button">بریم که بریم 💌</button>
      </section>
      <section class="screen" id="step-done" hidden>
        <div class="feature-icon" id="icon-done">🎉</div>
        <p class="eyebrow" id="doneEyebrow"></p>
        <h1 id="doneTitle">خوشحالم نگفتی نه!</h1>
        <p class="date-highlight" id="final-promise"></p>
        <div class="final-summary"><span>📅 <b id="final-date"></b></span><span>⏰ <b id="final-time"></b></span><span>🍕 <b id="final-food"></b></span></div>
        <p class="description done-desc" id="doneIntro"></p>
        <p class="love-note" id="doneNote"></p>
        <div class="end-hearts" aria-hidden="true">💗 💕 💗</div>
      </section>
    </div>
    <footer id="footer"></footer>
  </main>
</body>
</html>
